version: 2
updates:
  # Group weekly application and development package updates into manageable PRs
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      runtime:
        dependency-type: production
      development:
        dependency-type: development

  # Review pinned GitHub Actions updates separately from application dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Keep the Docker build and runtime base images on a reviewed weekly update schedule
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

    # Keep Node Docker proposals within Node 24 while other dependencies retain their update policies
    # Coordinate even Node 24 patches with the exact engine and tooling pins before merging
    ignore:
      - dependency-name: node
        versions: ['>=25']
    groups:
      base-images:
        patterns: ['*']
