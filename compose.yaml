services:
  app:
    build: .
    image: study-lab:local
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000'
    volumes:
      - study-data:/app/data
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  study-data:
